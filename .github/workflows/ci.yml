name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supported-floor:
    name: Supported floor (Node 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20.0.0"
      - run: node plugins/lazyzcode/scripts/verify-supported-floor.mjs --expected-runtime 20.0.0 --exercise package,install,onboarding,lsp-provider

  core:
    name: Core verification (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LAZYZCODE_VERIFY_SUITE: core
      LAZYZCODE_VERIFY_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install locked tooling dependencies
        working-directory: plugins/lazyzcode/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run package verification
        run: bash plugins/lazyzcode/scripts/lazyzcode-verify.sh
      - name: Run publication verification
        run: bash plugins/lazyzcode/tests/publication-regression.sh

  core-current:
    name: Core verification (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LAZYZCODE_VERIFY_SUITE: core
      LAZYZCODE_VERIFY_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install locked tooling dependencies
        working-directory: plugins/lazyzcode/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run package verification
        run: bash plugins/lazyzcode/scripts/lazyzcode-verify.sh

  lifecycle:
    name: Lifecycle regressions (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      LAZYZCODE_VERIFY_SUITE: lifecycle
      LAZYZCODE_VERIFY_TIMEOUT_SECONDS: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install locked tooling dependencies
        working-directory: plugins/lazyzcode/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run timing-sensitive lifecycle regressions
        run: bash plugins/lazyzcode/scripts/lazyzcode-verify.sh

  validate:
    name: Deterministic validation
    if: ${{ always() }}
    needs: [supported-floor, core, core-current, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all blocking jobs to succeed
        env:
          SUPPORTED_FLOOR_RESULT: ${{ needs.supported-floor.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CORE_CURRENT_RESULT: ${{ needs.core-current.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
        run: |
          test "$SUPPORTED_FLOOR_RESULT" = success
          test "$CORE_RESULT" = success
          test "$CORE_CURRENT_RESULT" = success
          test "$LIFECYCLE_RESULT" = success
