name: Scheduled compatibility

on:
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Full compatibility (Node 26, macOS)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LAZYZCODE_VERIFY_SUITE: all
      LAZYZCODE_VERIFY_TIMEOUT_SECONDS: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
      - name: Install locked tooling dependencies
        working-directory: plugins/lazyzcode/tooling
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run full package verification
        run: bash plugins/lazyzcode/scripts/lazyzcode-verify.sh
      - name: Run publication verification
        run: bash plugins/lazyzcode/tests/publication-regression.sh
